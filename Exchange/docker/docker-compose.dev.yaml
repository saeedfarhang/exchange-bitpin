services:
  postgres:
    image: postgres:16
    container_name: exchange-postgres
    restart: always
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: exchange

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: exchange-api
    restart: always
    depends_on:
      - postgres
    ports:
      - 8001:8000
    env_file:
      - .env.internal
