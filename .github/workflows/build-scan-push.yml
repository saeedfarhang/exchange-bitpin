# Build the Exchange image, scan it with Trivy, then push to an example registry.

name: Build, scan and push

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  CONTEXT: Exchange
  DOCKERFILE: Exchange/docker/Dockerfile

jobs:
  build-scan-push:
    name: Build, scan and push
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          name="$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,secret
          exit-code: "1"
          version: v0.74.0

      - name: Generate Trivy SARIF report
        if: always() && !cancelled()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,secret
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          version: v0.74.0

      - name: Upload Trivy SARIF report
        if: always() && !cancelled()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # Docker Hub example:
          # registry: docker.io
          # username: ${{ secrets.DOCKERHUB_USERNAME }}
          # password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "${tag}" ] && docker push "${tag}"
          done <<< "${TAGS}"

      - name: Summary
        if: always() && !cancelled()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Container image"
            echo
            echo "- Registry: \`${{ env.REGISTRY }}\`"
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Scan: Trivy (CRITICAL/HIGH, unfixed ignored) — push runs only after the scan passes"
            echo "- Tag: commit SHA (\`${{ steps.meta.outputs.version }}\`)"
            echo "- Push: enabled on \`main\`"
            echo
            echo "Tags:"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
